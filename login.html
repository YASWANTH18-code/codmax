<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BlogSpace</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <a href="/" class="logo auth-logo"><span class="logo-icon">B</span> BlogSpace</a>
  <main class="auth-card">
    <span class="eyebrow">WELCOME BACK</span><h1>Log in to your account</h1>
    <p class="muted">Continue sharing your ideas with the world.</p>
    <form id="loginForm">
      <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
      <button class="primary-btn full-btn" type="submit">Log In</button>
      <p id="formMessage" class="form-message" aria-live="polite"></p>
    </form>
    <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    <a href="/" class="back-link">← Back to home</a>
  </main>
  <script src="js/api.js"></script><script src="js/auth.js"></script>
</body>
</html>
