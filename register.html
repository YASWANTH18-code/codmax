<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | BlogSpace</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <a href="/" class="logo auth-logo"><span class="logo-icon">B</span> BlogSpace</a>
  <main class="auth-card">
    <span class="eyebrow">JOIN THE COMMUNITY</span><h1>Create your account</h1>
    <p class="muted">Start writing and sharing your stories.</p>
    <form id="registerForm">
      <label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" maxlength="60" placeholder="Your name" required>
      <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
      <button class="primary-btn full-btn" type="submit">Create Account</button>
      <p id="formMessage" class="form-message" aria-live="polite"></p>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    <a href="/" class="back-link">← Back to home</a>
  </main>
  <script src="js/api.js"></script><script src="js/auth.js"></script>
</body>
</html>
